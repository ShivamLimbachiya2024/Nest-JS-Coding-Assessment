name: TaskFlow CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.7-management
        env:
          RABBITMQ_DEFAULT_USER: taskflow
          RABBITMQ_DEFAULT_PASS: taskflow-dev-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      SERVICE_NAME: taskflow-ci
      USER_SERVICE_PORT: 3001
      TASK_SERVICE_PORT: 3002
      NOTIFICATION_SERVICE_PORT: 3003
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: root
      DATABASE_PASSWORD: password
      DATABASE_NAME: taskflow
      RABBITMQ_URL: amqp://taskflow:taskflow-dev-password@localhost:5672
      JWT_ACCESS_SECRET: taskflow-ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: taskflow-ci-refresh-secret-0123456789abcdef
      JWT_ISSUER: taskflow-user-service
      JWT_AUDIENCE: taskflow-services
      CORS_ORIGINS: http://localhost:3000
      WORKER_QUEUE: taskflow-user-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-policy
      - run: npm run format-check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --silent
      - run: npm run migration-run-user
      - run: npm run migration-run-task
      - run: npm run migration-run-notification
      - run: npm run migration-revert-notification
      - run: npm run migration-revert-task
      - run: npm run migration-revert-user
      - run: npm run migration-run-user
      - run: npm run migration-run-task
      - run: npm run migration-run-notification
      - run: npm run test-e2e
      - run: npm run build
      - run: npm audit --omit=dev
      - run: docker build -f docker/Dockerfile .
