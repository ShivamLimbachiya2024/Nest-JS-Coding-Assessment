services:
  rabbitmq:
    image: rabbitmq:4.3.7-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbitmq-dev-password
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - taskflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskflow
    ports:
      - '5432:5432'
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d taskflow']
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    profiles: ['application']
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ['npm', 'run', 'start-user']
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file: apps/user-service/.env
    environment:
      SERVICE_NAME: user-service
      DATABASE_HOST: postgres
      RABBITMQ_URL: amqp://rabbit:rabbitmq-dev-password@rabbitmq:5672
    ports:
      - '3001:3001'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  task-service:
    profiles: ['application']
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ['npm', 'run', 'start-task']
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file: apps/task-service/.env
    environment:
      SERVICE_NAME: task-service
      DATABASE_HOST: postgres
      RABBITMQ_URL: amqp://rabbit:rabbitmq-dev-password@rabbitmq:5672
    ports:
      - '3002:3002'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-service:
    profiles: ['application']
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ['npm', 'run', 'start-notification']
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file: apps/notification-service/.env
    environment:
      SERVICE_NAME: notification-service
      DATABASE_HOST: postgres
      RABBITMQ_URL: amqp://rabbit:rabbitmq-dev-password@rabbitmq:5672
    ports:
      - '3003:3003'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  user-verification-worker:
    profiles: ['application']
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ['npm', 'run', 'start-user-verification-worker']
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file: apps/user-service/.env
    environment:
      SERVICE_NAME: user-verification-worker
      DATABASE_HOST: postgres
      RABBITMQ_URL: amqp://rabbit:rabbitmq-dev-password@rabbitmq:5672
      WORKER_QUEUE: user_verification
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-task-completed-worker:
    profiles: ['application']
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ['npm', 'run', 'start-notification-task-completed-worker']
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file: apps/notification-service/.env
    environment:
      SERVICE_NAME: notification-task-completed-worker
      DATABASE_HOST: postgres
      RABBITMQ_URL: amqp://rabbit:rabbitmq-dev-password@rabbitmq:5672
      WORKER_QUEUE: notification_task_completed
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  task-outbox-publisher:
    profiles: ['application']
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ['npm', 'run', 'start-task-outbox']
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file: apps/task-service/.env
    environment:
      SERVICE_NAME: task-outbox-publisher
      DATABASE_HOST: postgres
      RABBITMQ_URL: amqp://rabbit:rabbitmq-dev-password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  taskflow-postgres-data:
  taskflow-rabbitmq-data:
